# SNXZ Color Palette (from omarchy-snxz-theme)
[theme]
name = "snxz"
author = "shakilnwz"

[palette]
background = "#00000e"
foreground = "#c7efe3"
accent = "#7186fd"
selection_bg = "#31314e"
selection_fg = "#c7efe3"
cursor = "#c7efe3"

# ANSI Standard (0-7)
color0 = "#00000e" # Black
color1 = "#ff4d6d" # Red
color2 = "#00d4a8" # Green (Teal)
color3 = "#ffd166" # Yellow
color4 = "#7186fd" # Blue (Indigo)
color5 = "#b388ff" # Magenta (Purple)
color6 = "#00cfe8" # Cyan
color7 = "#c7efe3" # White (Mint)

# ANSI Bright (8-15)
color8 = "#5f6167"  # Bright Black (Gray)
color9 = "#ff6f8f"  # Bright Red
color10 = "#33f0c0" # Bright Green
color11 = "#ffe085" # Bright Yellow
color12 = "#5cb7ff" # Bright Blue
color13 = "#c7a6ff" # Bright Magenta
color14 = "#3aeaff" # Bright Cyan
color15 = "#e6fff7" # Bright White
