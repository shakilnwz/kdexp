# Starship Prompt Configuration (SNXZ Theme)
format = """
[┌─](bold #5f6167)$directory$git_branch$git_status$package$nodejs$rust$golang$php
[└─>](bold #7186fd) """

add_newline = false

[directory]
style = "bold #00cfe8"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"

[git_branch]
style = "bold #b388ff"
symbol = " "

[git_status]
style = "bold #ff4d6d"
modified = "!"
untracked = "?"
staged = "+"
deleted = "✘"

[package]
style = "bold #ffd166"
symbol = "📦 "

[nodejs]
style = "bold #33f0c0"
symbol = "⬢ "

[rust]
style = "bold #ff6f8f"
symbol = "🦀 "

[golang]
style = "bold #3aeaff"
symbol = "🐹 "

[php]
style = "bold #7186fd"
symbol = "🐘 "

[character]
success_symbol = "[❯](bold #00d4a8)"
error_symbol = "[❯](bold #ff4d6d)"
